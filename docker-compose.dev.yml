# Локальная разработка: публикует PostgreSQL и Redis только на loopback.
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
# Затем приложение можно запускать локально через npm:
#   cd app && npm run dev:api
#
# Значения DATABASE_URL и REDIS_URL для локального запуска должны указывать
# на 127.0.0.1 (см. .env.example).

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
