name: persephone

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_HOST: 0.0.0.0
  API_PORT: "3000"
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
  DATABASE_URL: postgresql://${POSTGRES_USER:-persephone}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-persephone}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Задайте SECRET_ENCRYPTION_KEY в .env}
  SECRET_ENCRYPTION_KEY_VERSION: ${SECRET_ENCRYPTION_KEY_VERSION:-1}
  MUSIC_ROOT_CONTAINER: ${MUSIC_ROOT_CONTAINER:-/music}
  STORAGE_ROOT_NAME: ${STORAGE_ROOT_NAME:-local-music}
  STORAGE_ROOT_IDENTIFIER: ${STORAGE_ROOT_IDENTIFIER:-local-music}
  NAVIDROME_URL: ${NAVIDROME_URL:-http://navidrome:4533}
  NAVIDROME_USER: ${NAVIDROME_USER:-}
  NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
  LIDARR_URL: ${LIDARR_URL:-http://lidarr:8686}
  LIDARR_API_KEY: ${LIDARR_API_KEY:-}
  MUSICBRAINZ_BASE_URL: ${MUSICBRAINZ_BASE_URL:-https://musicbrainz.org/ws/2}
  MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-PersephoneMusic/0.1 (+https://github.com/DrRocksoDevelopment/persephone)}
  LASTFM_BASE_URL: ${LASTFM_BASE_URL:-https://ws.audioscrobbler.com/2.0/}
  LASTFM_API_KEY: ${LASTFM_API_KEY:-}
  LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-persephone}
      POSTGRES_USER: ${POSTGRES_USER:-persephone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./app
      target: production
    image: persephone-app:local
    command: ["node", "src/db/migrate-cli.js", "up"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./app
      target: production
    image: persephone-app:local
    restart: unless-stopped
    environment:
      <<: *app-environment
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - "${MUSIC_ROOT_HOST:-./data/music}:${MUSIC_ROOT_CONTAINER:-/music}:ro"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./app
      target: production
    image: persephone-app:local
    restart: unless-stopped
    command: ["node", "src/workers/worker.js"]
    environment:
      <<: *app-environment
    volumes:
      - "${MUSIC_ROOT_HOST:-./data/music}:${MUSIC_ROOT_CONTAINER:-/music}:ro"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/workers/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: ${MUSIC_ROOT_CONTAINER:-/music}
      ND_DATAFOLDER: /data
      ND_PORT: "4533"
      ND_LOGLEVEL: ${NAVIDROME_LOG_LEVEL:-info}
      ND_SCANSCHEDULE: ${NAVIDROME_SCAN_SCHEDULE:-1h}
    volumes:
      - navidrome-data:/data
      - "${MUSIC_ROOT_HOST:-./data/music}:${MUSIC_ROOT_CONTAINER:-/music}:ro"
    ports:
      - "127.0.0.1:${NAVIDROME_PORT:-4533}:4533"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4533/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.6.5079-ls46
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - lidarr-config:/config
      - "${MUSIC_ROOT_HOST:-./data/music}:${MUSIC_ROOT_CONTAINER:-/music}"
      - "${LIDARR_DOWNLOADS_HOST:-./data/downloads}:/downloads"
    ports:
      - "127.0.0.1:${LIDARR_PORT:-8686}:8686"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  navidrome-data:
  lidarr-config:
